<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Rustix — Форум</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Arial, sans-serif;
  }

  html {
    background: #3a3a3a;
  }

  body {
    background: linear-gradient(180deg, #6b6b6b 0%, #4a4a4a 25%, #3a3a3a 100%);
    background-attachment: fixed;
    min-height: 100vh;
    color: #e6e6e6;
    padding: 20px;
  }

  .header {
    text-align: center;
    padding: 25px 0 35px 0;
  }

  .header h1 {
    font-size: 48px;
    letter-spacing: 3px;
    color: #ffffff;
    text-shadow: 0 2px 6px rgba(0,0,0,0.6);
    font-weight: 700;
  }

  .header .underline {
    width: 220px;
    height: 3px;
    background: #b0b0b0;
    margin: 12px auto 0 auto;
    border-radius: 2px;
  }

  /* ЦЕНТРАЛЬНЫЙ КОНТЕЙНЕР (без сайдбара) */
  .container {
    max-width: 900px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .section-title {
    font-size: 22px;
    color: #ffffff;
    margin-bottom: 14px;
    padding-bottom: 8px;
    border-bottom: 2px solid #5c5c5c;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .section-title::before {
    content: '';
    display: inline-block;
    width: 5px;
    height: 22px;
    background: #7fb8e0;
    border-radius: 3px;
  }

  /* СПИСОК ФОРУМОВ */
  .forum-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .forum-card {
    display: flex;
    align-items: center;
    gap: 16px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    border-left: 4px solid #7fb8e0;
    border-radius: 8px;
    padding: 16px 20px;
    text-decoration: none;
    color: inherit;
    transition: 0.2s;
    cursor: pointer;
  }

  .forum-card:hover {
    background: rgba(255,255,255,0.09);
    transform: translateX(5px);
    border-left-color: #a4d0ec;
    box-shadow: 0 4px 14px rgba(0,0,0,0.35);
  }

  .forum-icon {
    width: 48px;
    height: 48px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    background: rgba(127,184,224,0.12);
    border-radius: 10px;
    border: 1px solid rgba(127,184,224,0.25);
  }

  .forum-info {
    flex: 1;
    min-width: 0;
  }

  .forum-name {
    font-size: 18px;
    font-weight: 700;
    color: #ffffff;
    margin-bottom: 4px;
  }

  .forum-desc {
    font-size: 13.5px;
    color: #b0b0b0;
    line-height: 1.4;
  }

  .forum-meta {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 4px;
    font-size: 12.5px;
    color: #9a9a9a;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .forum-meta .count {
    color: #7fb8e0;
    font-weight: 600;
    font-size: 14px;
  }

  .forum-arrow {
    color: #7fb8e0;
    font-size: 22px;
    flex-shrink: 0;
    transition: 0.2s;
  }

  .forum-card:hover .forum-arrow {
    transform: translateX(4px);
  }

  /* ПОДВАЛ */
  .footer {
    text-align: center;
    padding: 30px 0 10px 0;
    font-size: 13px;
    color: #8a8a8a;
  }

  @media (max-width: 800px) {
    .header h1 {
      font-size: 32px;
    }
    .forum-card {
      padding: 14px 16px;
      gap: 12px;
    }
    .forum-icon {
      width: 40px;
      height: 40px;
      font-size: 22px;
    }
    .forum-meta {
      display: none;
    }
  }
</style>
</head>
<body>

  <div class="header">
    <h1>Rustix forum</h1>
    <div class="underline"></div>
  </div>

  <div class="container">

    <section>
      <div class="section-title">Разделы форума</div>

      <div class="forum-list">

        <!-- ФОРУМ "RULES" -->
        <a class="forum-card" href="https://rustixserver.github.io/Rules/" target="_blank">
          <div class="forum-icon">📜</div>
          <div class="forum-info">
            <div class="forum-name">Rules</div>
            <div class="forum-desc">Правила сервера Rustix — обязательно к прочтению каждому игроку.</div>
          </div>
          <div class="forum-meta">
            <span class="count">11 тем</span>
            <span>Закреплено</span>
          </div>
          <div class="forum-arrow">→</div>
        </a>

        <!-- ФОРУМ "ANNOUNCEMENTS" -->
        <a class="forum-card" href="#">
          <div class="forum-icon">📢</div>
          <div class="forum-info">
            <div class="forum-name">Announcements</div>
            <div class="forum-desc">Новости, обновления и анонсы от администрации проекта.</div>
          </div>
          <div class="forum-meta">
            <span class="count">0 тем</span>
            <span>Скоро</span>
          </div>
          <div class="forum-arrow">→</div>
        </a>

      </div>
    </section>

  </div>

  <div class="footer">© Rustix 2026 — официальный форум проекта</div>

</body>
</html>
